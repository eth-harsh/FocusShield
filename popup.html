<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="popup.css" />
    <title>FocusShield</title>
  </head>
  <body>
    <main>
      <header>
        <div class="icon">
          <i class="fa-solid fa-feather fa-float"></i>
        </div>
        <div class="title">
          <h1>Focus</h1>
          <p>Your personal focus assistant</p>
        </div>
      </header>
      <hr />
      <div class="content">
        <span style="color: #fde68a">SESSION DURATION </span>
        <div
          style="background-color: #3f3f46; padding: 10px; border-radius: 15px"
        >
          <select id="duration">
            <option value="25" selected>25 minutes</option>
            <option value="50">50 minutes</option>
            <option value="90">90 minutes</option>
          </select>
        </div>
        <span style="color: #fde68a"> CURRENT SESSION </span>
        <div
          style="background-color: #3f3f46; padding: 10px; border-radius: 15px"
        >
          <p id="website" style="font-size: 18px">Detecting soon...</p>
        </div>

        <button id="startButton">Start Focus</button>

        <!-- <p id="status">Focus Mode is off</p> -->
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
